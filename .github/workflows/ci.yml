name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: ingest (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/ingest/go.mod
          cache-dependency-path: apps/ingest/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  api:
    name: api (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose --profile apps config -q

  integration:
    name: integración (stack completo en Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile apps --profile sim up -d --build
      - run: scripts/smoke.sh
      - name: Logs si falla
        if: failure()
        run: docker compose --profile apps --profile sim logs --tail=100
      - if: always()
        run: docker compose --profile apps --profile sim down -v

  integration-secure:
    name: integración endurecida (TLS, autenticación, Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bootstrap-secure.sh
      - run: >
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --env-file .env.prod --profile apps --profile sim up -d --build
      - run: scripts/smoke-secure.sh
      - name: Logs si falla
        if: failure()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --env-file .env.prod --profile apps --profile sim logs --tail=100
      - if: always()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --env-file .env.prod --profile apps --profile sim down -v
