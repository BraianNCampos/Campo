name: Demo en GitHub Pages

# Publica la web en modo demo (sin backend, con datos simulados) como sitio estático:
# https://<usuario>.github.io/<repositorio>/
# Requiere activar Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main, claude/keen-goldberg-fuf53r]
    paths: ['apps/web/**', 'packages/shared/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Construir la demo estática
        run: npm run build
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_MOCK: '1'
          NEXT_PUBLIC_STATIC_DEMO: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_DIST_DIR: out
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
