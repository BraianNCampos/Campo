# Campo 2.0 — infraestructura local (Fase 1)
# Uso: cp .env.example .env && docker compose up -d
name: campo

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: campo-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-campo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campo} -d ${POSTGRES_DB:-campo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campo-net

  redis:
    image: redis:7-alpine
    container_name: campo-redis
    restart: unless-stopped
    # AOF activado: el estado actual de los equipos sobrevive a un reinicio.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - campo-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: campo-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"   # MQTT (sensores / servicio de ingesta)
      - "${MQTT_WS_PORT:-9001}:9001" # MQTT sobre WebSockets (depuración)
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - campo-net

  # ---- Aplicación (perfil "apps"): docker compose --profile apps up -d --build ----
  ingest:
    profiles: ["apps"]
    build:
      context: ./apps/ingest
    container_name: campo-ingest
    restart: unless-stopped
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: campo-ingest
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${POSTGRES_USER:-campo}:${POSTGRES_PASSWORD:-campo_dev}@timescaledb:5432/${POSTGRES_DB:-campo}?sslmode=disable
    ports:
      - "${INGEST_HTTP_PORT:-8080}:8080"   # /healthz /readyz /metrics
    depends_on:
      mosquitto: { condition: service_healthy }
      redis: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    networks:
      - campo-net

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: campo-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}   # el overlay de producción lo fija en "production" (exige secretos reales)
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET (>=32 caracteres) en .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-campo}:${POSTGRES_PASSWORD:-campo_dev}@timescaledb:5432/${POSTGRES_DB:-campo}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD en .env}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      redis: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    networks:
      - campo-net

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Las URL las usa el NAVEGADOR (se incrustan en el build), no el contenedor.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
        NEXT_PUBLIC_WS_URL: ws://localhost:${API_PORT:-3001}/ws
        NEXT_PUBLIC_MOCK: "0"
    container_name: campo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - campo-net

  # Simulador de la planta "demo" (perfil "sim"): docker compose --profile apps --profile sim up -d
  simulator:
    profiles: ["sim"]
    build:
      context: ./apps/ingest
    container_name: campo-simulator
    restart: unless-stopped
    entrypoint: ["/simulator"]
    command: ["-broker", "tcp://mosquitto:1883"]
    depends_on:
      mosquitto: { condition: service_healthy }
    networks:
      - campo-net

volumes:
  timescaledb_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:

networks:
  campo-net:
    driver: bridge
