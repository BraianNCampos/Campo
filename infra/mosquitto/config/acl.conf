# ACL de Mosquitto — contrato docs/architecture.md §8.2.
#
# Regla de oro: lo que no se concede aquí, está denegado (y $SYS también).
# Los patrones %u se sustituyen por el nombre de usuario MQTT: por eso el usuario de cada planta
# se llama EXACTAMENTE como el id de la planta (p. ej. `demo`).

# Servicio de ingesta: sólo lectura de toda la telemetría (no puede publicar).
user ingest
topic read campo/v1/#

# API (control de llenado, docs/architecture.md §14.4): publica órdenes a cualquier planta y lee sus acuses.
user api
topic write campo/v1/+/+/cmd
topic read campo/v1/+/+/cmd/ack

# Sonda de salud del contenedor (sólo el uptime del broker).
user healthcheck
topic read $SYS/broker/uptime

# Cada planta (usuario = id de planta):
#   - publica únicamente su telemetría
#   - lee únicamente sus comandos y responde sólo con acuses (cmd/ack)
pattern write campo/v1/%u/+/telemetry
pattern read campo/v1/%u/+/cmd
pattern write campo/v1/%u/+/cmd/ack
