# Mosquitto — configuración SOLO PARA DESARROLLO LOCAL.
# En producción: allow_anonymous false + password_file/ACL + TLS (8883).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
