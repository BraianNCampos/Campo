# Mosquitto — configuración ENDURECIDA (producción / pila de docker-compose.prod.yml).
# Contrato: docs/architecture.md §8.2.  Guía: docs/security.md.
#
# Rutas dentro del contenedor (las monta docker-compose.prod.yml; las genera scripts/bootstrap-secure.sh):
#   /mosquitto/config/mosquitto.conf   <- este fichero
#   /mosquitto/config/acl.conf         <- infra/mosquitto/config/acl.conf
#   /mosquitto/security/passwd         <- secrets/mosquitto/passwd   (hashes; sin contraseñas en claro)
#   /mosquitto/certs/{ca.crt,server.crt,server.key}   <- secrets/certs/

# ---- Persistencia y logs -------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# Registra conexiones, desconexiones y fallos de autenticación (útil para detectar fuerza bruta).
connection_messages true

# ---- Autenticación y autorización (globales: valen para todos los listeners) -----------------
allow_anonymous false
password_file /mosquitto/security/passwd
acl_file /mosquitto/config/acl.conf
allow_zero_length_clientid false

# ---- Límites defensivos ----------------------------------------------------------------------
# Los payloads reales son < 1 KiB y el parser de ingest descarta > 64 KiB.
max_packet_size 65536
max_inflight_messages 100
max_queued_messages 5000

# ---- ÚNICO listener: MQTT sobre TLS ---------------------------------------------------------
# Sin listener 1883 en claro y sin WebSocket (9001): no existen en esta configuración.
listener 8883
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# TLS >= 1.2 (se negocia 1.3 cuando el cliente lo soporta). No se usa `tls_version`
# porque fijaría UNA sola versión; ver verificación de TLS 1.1/1.0 en scripts/smoke-secure.sh.
# Sólo se aceptan clientes que presenten usuario y contraseña; no se exige certificado de
# cliente (mTLS por dispositivo queda como mejora, ver docs/security.md).
require_certificate false
